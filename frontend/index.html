<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Delve — an AI research assistant that searches the web, reads sources and writes cited reports." />
    <meta name="theme-color" content="#0B1514" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBFAF4" media="(prefers-color-scheme: light)" />
    <title>Delve — AI research assistant</title>
    <script>
      try {
        var saved = localStorage.getItem("delve.theme");
        var theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
